<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucid UI app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3.5/src/ui/lucid.css">
<style>
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; box-sizing: border-box; }
  body { padding: 28px; background: var(--lucid-surface); color: var(--lucid-ink); font-family: Geist, system-ui, sans-serif; }
  .demo-title { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .demo-card { max-width: 380px; padding: 24px; border-radius: 16px; background: var(--lucid-surface-raised); box-shadow: 0 0 0 1px var(--lucid-line), var(--lucid-shadow-sm); }
</style>

<script type="importmap">
{
  "imports": {
    "@lucidui-dev/core": "https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3.5/src/index.js",
    "@lucidui-dev/core/ui": "https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3.5/src/ui/index.js",
    "@lucidui-dev/core/viz": "https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3.5/src/viz/index.js",
    "@lucidui-dev/core/bundle": "https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3.5/bundle/lucid.js"
  }
}
</script>
</head>
<body class="lucid-app">
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
